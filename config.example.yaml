# Each feature runs when its section is present: addresses, withdraw and
# payments need listen; notifications, withdraw, nostr and payments need state_dir.
listen: "0.0.0.0:8080"
state_dir: "/app/data"

# SOCKS5 proxy for notifications and relay publishing. Does not affect the node connection.
# outbound_proxy: "socks5://127.0.0.1:9050"

# Reverse proxies in front of this service, as IP addresses or CIDR ranges.
# X-Forwarded-For and X-Forwarded-Host are honoured only on requests from them.
trusted_proxies:
  - "172.16.0.0/12"

# Requests allowed per client address: burst at once, then per_minute a
# minute. These are the defaults.
rate_limit:
  per_minute: 60
  burst: 30

# Stable key source for LUD-21 verify URLs, independent of node credentials.
# For a new deployment: openssl rand -out verify.key 32
# verify_key_file: "/run/secrets/verify-key"

# One node: lnd or cln.
lnd:
  host: "lnd:10009"
  tls_cert: "/certs/tls.cert"
  macaroon: "/macaroons/invoice.macaroon"

# cln:
#   url: "https://cln:3010"
#   rune_file: "/certs/rune"
#   # The node's ca.pem. Without it, the server needs a publicly trusted certificate.
#   ca_cert: "/certs/ca.pem"

# Notifies about every invoice settled on the node, including ones settled
# while this service was down.
notifications:
  ntfy:
    url: "https://ntfy.yourdomain.com"
    topic: "lightning-payments"
    # Or token_file: a file holding the token.
    token: ""
  # webhooks:
  #   accounting:
  #     url: "https://accounting.example.com/hooks/lightning"
  #     events: [invoice.created, payment.received]
  #     secret_file: "/run/secrets/accounting-webhook"
  #   alerts:
  #     url: "https://alerts.example.com/hooks/vouchers"
  #     events: [voucher.claimed, voucher.payout_failed, voucher.payout_unknown, payment.sent, payment.failed]
  #     secret_file: "/run/secrets/alerts-webhook"

# Required with withdraw vouchers. Generate the file with: openssl rand -hex 32
# Changing the secret changes every voucher URL.
# Use withdraw_secret for an inline value, or withdraw_secret_file, not both.
withdraw_secret_file: "/run/secrets/withdraw"

withdraw:
  - id: "tip-001"
    domain: "tips.yourdomain.com"
    description: "Restaurant tip"
    amount: 500000

  - id: "tip-002"
    domain: "tips.yourdomain.com"
    description: "Restaurant tip"
    amount: 500000

  - prefix: "tip-batch"
    domain: "tips.otherdomain.com"
    description: "Restaurant tip"
    amount: 500000
    count: 20

# Lets your own applications pay from the node. Each sends its token as
# Authorization: Bearer. Generate one with: openssl rand -hex 32
# Limits are in msat and optional; max_fee defaults to 1%, at least 10 sat.
# payments:
#   clients:
#     shop:
#       token_file: "/run/secrets/shop-payments"
#       allowed_ips: ["100.64.0.0/10"]
#       max_payment: 1000000
#       daily_budget: 10000000
#       max_fee: 10000

# Zaps (NIP-57) for every address. The file holds a key of its own, as hex or
# nsec: openssl rand -hex 32
# nostr:
#   private_key_file: "/run/secrets/nostr.key"

addresses:
  # Addresses are served on whatever domain the request arrives on.
  # Wildcard: accepts any username
  "*":
    description: "Lightning Address"
    min_sendable: 1000
    max_sendable: 1000000000

  # Explicit entry takes priority over wildcard
  satoshi:
    description: "Satoshi's Lightning Address"
    # Optional: shown on the pay screen instead of description. May span lines.
    long_description: |
      Tips for the blog.
      Thank you!
    # Optional: a PNG or JPEG of at most 100 KB, shown by the payer's wallet.
    image_file: "/app/data/satoshi.png"
    # Optional: shown by the payer's wallet after paying. At most 144 characters.
    success_message: "Thanks for the tip!"
    min_sendable: 1000
    max_sendable: 1000000000

  hal:
    description: "Hal's Lightning Address"
    min_sendable: 1000
    max_sendable: 1000000000
