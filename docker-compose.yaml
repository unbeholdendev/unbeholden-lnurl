services:
  unbeholden-lnurl:
    image: ghcr.io/unbeholdendev/unbeholden-lnurl:${TAG:-latest}
    ports:
      - "8080:8080"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - data:/app/data
      - ./tls.cert:/certs/tls.cert:ro
      - ./invoice.macaroon:/macaroons/invoice.macaroon:ro
      # - ./nostr.key:/run/secrets/nostr.key:ro
    healthcheck:
      test: ["CMD", "/app/unbeholden-lnurl", "-healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    stop_grace_period: 2m30s
    restart: unless-stopped

volumes:
  data:
