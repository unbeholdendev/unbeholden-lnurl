name: Regtest

on:
  pull_request:
    paths:
      - '**/*.go'
      - go.mod
      - go.sum
      - integration/**
      - '!**/*.md'
      - .forgejo/workflows/regtest.yml
  push:
    branches: [main]
    paths:
      - '**/*.go'
      - go.mod
      - go.sum
      - integration/**
      - '!**/*.md'
      - .forgejo/workflows/regtest.yml

jobs:
  regtest:
    runs-on: docker
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: https://github.com/cachix/install-nix-action@v31
        with:
          enable_kvm: false
      - name: Regtest payments and recovery on LND and CLN
        run: >-
          nix-shell integration/shell.nix --run
          'LNURL_REGTEST=1 go test -race -count=1 -timeout=10m -v ./integration'
