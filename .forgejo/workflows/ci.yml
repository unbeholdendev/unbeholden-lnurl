name: CI

on:
  pull_request:

jobs:
  check:
    runs-on: docker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go run honnef.co/go/tools/cmd/staticcheck@2026.2.2 ./...
        env:
          GOTOOLCHAIN: auto # staticcheck needs a newer Go than go.mod
